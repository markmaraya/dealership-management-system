<div class="upload-image-container">
  <h2 mat-dialog-title>Upload Image</h2>
  <form [formGroup]="galleryForm" (ngSubmit)="onUploadFormSubmit()">
    <mat-dialog-content>
      <mat-form-field class="full-width">
        <input
          type="file"
          matInput
          (change)="onFileSelected($event)"
          accept="image/*"
        />
        <mat-icon matSuffix>folder</mat-icon>
        <mat-error>
          <span *ngIf="!galleryForm.get('imageFile').valid"
            >Please select image file</span
          >
        </mat-error>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions>
      <button mat-button mat-dialog-close>Cancel</button>
      <button
        type="submit"
        [disabled]="!isUploadButtonActive"
        mat-flat-button
        color="primary"
      >
        <mat-icon>upload</mat-icon> Upload
      </button>
    </mat-dialog-actions>
  </form>
</div>
